version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /Utilities/CI
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      pip-utilities-ci:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /docs/users-guide
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      pip-docs-users-guide:
        patterns:
          - "*"
